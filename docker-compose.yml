services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seatpicker
      POSTGRES_PASSWORD: seatpicker
      POSTGRES_DB: seatpicker
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatpicker"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: seatpicker
      DB_PASSWORD: seatpicker
      DB_NAME: seatpicker
      APP_PORT: 8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
