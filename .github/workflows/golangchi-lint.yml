name: Go Linter 🚀

env:
  GOPRIVATE: github.com/alif-academy-uz

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: Проверка кода линтером
    runs-on: ubuntu-latest

    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache-dependency-path: |
            ./go.sum

      - name: Configure private repo access
        run: |
          git config --global url."https://x-access-token:${{ secrets.PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Update dependencies and tidy up
        run: |
          go mod tidy

      - name: Run golangci-lint
        run: |
          golangci-lint run ./... --timeout=10m --new

      - name: Install fieldalignment
        run: |
          go install golang.org/x/tools/go/analysis/passes/fieldalignment/cmd/fieldalignment@latest

      - name: Check field alignment
        run: |
          CHANGED_FILES=$(git diff --name-only origin/develop...HEAD | grep '\.go$' | grep -v '_test\.go$' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Running fieldalignment on changed non-test files: $CHANGED_FILES"
            if timeout 2m fieldalignment $CHANGED_FILES 2>&1 | grep -q "struct with.*pointer bytes could be"; then
              echo "Found field alignment issues in changed non-test files"
              timeout 2m fieldalignment $CHANGED_FILES
              exit 1
            else
              echo "Field alignment check passed for changed files"
            fi
          else
            echo "No non-test Go files changed, skipping fieldalignment check"
          fi
